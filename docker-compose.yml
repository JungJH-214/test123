# 로컬 개발용 PostgreSQL. 접속 정보는 루트 .env에서 읽는다
# 로컬에 설치한 PostgreSQL이 5432를 쓰고 있으면 .env에 POSTGRES_PORT=5433처럼 다른 포트를 지정한다
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eduhub-pgdata:/var/lib/postgresql/data

volumes:
  eduhub-pgdata:
